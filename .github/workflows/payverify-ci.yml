name: PayVerify CI

concurrency:
  group: payverify-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Unit tests and debug APK
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: payverify-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # APK firmado publicado en un link fijo:
  # https://github.com/Edysael/PayVerify/releases/latest/download/payverify.apk
  # Solo en main y solo si existen los secretos de firma.
  android-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
        with: { gradle-version: 8.10.2 }
      - name: Signed release APK
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PV_VERSION_CODE: ${{ github.run_number }}
          PV_VERSION_NAME: 0.4.${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export PV_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          gradle -p android assembleRelease --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/payverify.apk"
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v0.4.${{ github.run_number }}" "$RUNNER_TEMP/payverify.apk" \
            --title "PayVerify Android 0.4.${{ github.run_number }}" \
            --notes "APK firmado de PayVerify. Descarga: https://github.com/Edysael/PayVerify/releases/latest/download/payverify.apk" \
            --latest --target "${{ github.sha }}"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Dependency audit (informativo)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash ./supabase/tests/run.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lógica de statement-import (cliente simulado)
        run: bash ./supabase/tests/functions/run.sh
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Type-check de las Edge Functions (informativo hasta confirmar que pasa limpio)
        run: deno check supabase/functions/*/index.ts
        continue-on-error: true
